[build]
  publish = "."

# Proxy API calls from the Netlify site to your Render backend.
# After you create the Render service, replace YOUR_RENDER_BACKEND_URL
# with the real URL (example: https://secure-sharing-api.onrender.com).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND_URL/api/:splat"
  status = 200
  force = true

# Optional (nice): keep health reachable via the same proxy
[[redirects]]
  from = "/health"
  to = "https://YOUR_RENDER_BACKEND_URL/health"
  status = 200
  force = true
