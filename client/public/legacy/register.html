<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Register</title>
		<script>
			(function () {
				try {
					const stored = localStorage.getItem("theme");
					const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
					const theme = stored || (prefersLight ? "light" : "dark");
					document.documentElement.setAttribute("data-theme", theme);
				} catch {
					// ignore
				}
			})();
		</script>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg-1: #05070f;
				--bg-2: #1b0f13;
				--card: rgba(255, 255, 255, 0.075);
				--card-2: rgba(255, 255, 255, 0.045);
				--card-border: rgba(255, 255, 255, 0.14);
				--text: rgba(255, 255, 255, 0.92);
				--muted: rgba(255, 255, 255, 0.70);
				--input: rgba(255, 255, 255, 0.09);
				--input-border: rgba(255, 255, 255, 0.14);
				--primary-1: #ef4444;
				--primary-2: #f59e0b;
				--focus: rgba(239, 68, 68, 0.28);
				--shadow: 0 38px 110px rgba(0, 0, 0, 0.62);
				--placeholder: rgba(255, 255, 255, 0.55);
			}

			html[data-theme="light"] {
				--bg-1: #ffffff;
				--bg-2: #f3f4f6;
				--card: rgba(255, 255, 255, 0.78);
				--card-2: rgba(255, 255, 255, 0.62);
				--card-border: rgba(15, 23, 42, 0.10);
				--text: rgba(15, 23, 42, 0.92);
				--muted: rgba(15, 23, 42, 0.68);
				--input: rgba(255, 255, 255, 0.90);
				--input-border: rgba(15, 23, 42, 0.12);
				--shadow: 0 24px 70px rgba(2, 6, 23, 0.14);
				--placeholder: rgba(15, 23, 42, 0.45);
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: "Poppins", sans-serif;
				width: 100vw;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(900px circle at 15% 20%, rgba(239, 68, 68, 0.20), transparent 48%),
					radial-gradient(900px circle at 80% 12%, rgba(245, 158, 11, 0.18), transparent 42%),
					linear-gradient(180deg, var(--bg-1), var(--bg-2));
				color: var(--text);
				padding: 24px;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			form {
				width: min(420px, 92vw);
				padding: 26px 24px 20px;
				gap: 14px;
				display: flex;
				flex-direction: column;
				background: linear-gradient(180deg, var(--card), var(--card-2));
				border: 1px solid var(--card-border);
				backdrop-filter: blur(12px);
				border-radius: 14px;
				box-shadow: var(--shadow);
				position: relative;
			}

			form::before {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 14px;
				pointer-events: none;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10);
			}

			h3 {
				font-size: 22px;
				font-weight: 600;
				letter-spacing: 0.2px;
				margin-bottom: 4px;
			}

			.app-title {
				font-size: 18px;
				font-weight: 600;
				letter-spacing: 0.3px;
				text-align: center;
				margin-bottom: 2px;
				background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
			}

			.form-message {
				display: none;
				padding: 10px 12px;
				border-radius: 10px;
				font-size: 13px;
				line-height: 1.35;
				background: rgba(255, 255, 255, 0.08);
				border: 1px solid rgba(255, 255, 255, 0.16);
				color: var(--text);
			}

			.form-message.is-visible {
				display: block;
			}

			.password-field {
				position: relative;
				width: 100%;
			}

			.password-field input {
				width: 100%;
				padding-right: 70px;
			}

			.toggle-btn {
				position: absolute;
				right: 8px;
				top: 50%;
				transform: translateY(-50%);
				padding: 6px 10px;
				background: rgba(255, 255, 255, 0.10);
				border: 1px solid var(--input-border);
				border-radius: 9px;
				color: var(--text);
				font-size: 12px;
				font-weight: 600;
				cursor: pointer;
			}

			.toggle-btn:focus {
				border-color: rgba(239, 68, 68, 0.55);
				box-shadow: 0 0 0 4px var(--focus);
				outline: none;
			}

			label {
				font-size: 13px;
				color: var(--muted);
				margin-top: 6px;
			}

			input {
				padding: 12px 12px;
				background: var(--input);
				border: 1px solid var(--input-border);
				border-radius: 10px;
				font-size: 14px;
				color: var(--text);
				outline: none;
			}

			input:hover {
				border-color: rgba(255, 255, 255, 0.20);
			}

			input:focus {
				border-color: rgba(239, 68, 68, 0.55);
				box-shadow: 0 0 0 4px var(--focus);
			}

			::placeholder {
				color: var(--placeholder);
			}

			.register {
				margin-top: 8px;
				padding: 12px 14px;
				border: 0;
				border-radius: 11px;
				cursor: pointer;
				color: white;
				font-weight: 600;
				background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
				box-shadow: 0 22px 70px rgba(239, 68, 68, 0.24);
			}

			.register:hover {
				filter: brightness(1.05);
			}

			.switch {
				margin-top: 10px;
				display: flex;
				justify-content: space-between;
				gap: 10px;
				color: var(--muted);
				font-size: 13px;
				align-items: center;
			}

			.switch a {
				color: rgba(255, 255, 255, 0.92);
				text-decoration: none;
				font-weight: 500;
				border-bottom: 1px solid rgba(255, 255, 255, 0.35);
			}

			.switch a:hover {
				border-bottom-color: rgba(239, 68, 68, 0.65);
				color: #f59e0b;
			}

			html[data-theme="light"] .switch a {
				color: rgba(15, 23, 42, 0.92);
				border-bottom-color: rgba(15, 23, 42, 0.25);
			}

			html[data-theme="light"] .switch a:hover {
				color: rgba(14, 165, 233, 0.95);
				border-bottom-color: rgba(14, 165, 233, 0.55);
			}

			.theme-toggle {
				position: fixed;
				top: 16px;
				right: 16px;
				width: 42px;
				height: 42px;
				border-radius: 14px;
				display: grid;
				place-items: center;
				cursor: pointer;
				border: 1px solid var(--card-border);
				background: linear-gradient(180deg, var(--card), var(--card-2));
				box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
				color: var(--text);
				z-index: 100;
			}

			.theme-toggle:focus {
				outline: none;
				box-shadow: 0 0 0 4px var(--focus), 0 18px 60px rgba(0, 0, 0, 0.22);
			}

			.theme-toggle svg {
				width: 18px;
				height: 18px;
			}

			html[data-theme="dark"] .theme-toggle .icon-moon {
				display: none;
			}

			html[data-theme="light"] .theme-toggle .icon-sun {
				display: none;
			}
		</style>
	</head>
	<body>
			<button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
				<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<circle cx="12" cy="12" r="4"></circle>
					<path d="M12 2v2"></path>
					<path d="M12 20v2"></path>
					<path d="M4.93 4.93l1.41 1.41"></path>
					<path d="M17.66 17.66l1.41 1.41"></path>
					<path d="M2 12h2"></path>
					<path d="M20 12h2"></path>
					<path d="M4.93 19.07l1.41-1.41"></path>
					<path d="M17.66 6.34l1.41-1.41"></path>
				</svg>
				<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
				</svg>
			</button>
		<form action="">
			<div class="app-title">Secure File Sharing Platform</div>
			<h3>Create Account</h3>
			<div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

			<label for="name">Full name</label>
			<input id="name" type="text" placeholder="Your name" required />

			<label for="email">Email</label>
			<input id="email" type="email" placeholder="you@example.com" required />

			<label for="password">Password</label>
			<div class="password-field">
				<input id="password" type="password" placeholder="Password" required />
				<button id="togglePassword" class="toggle-btn" type="button">View</button>
			</div>

			<label for="confirm">Confirm password</label>
			<input id="confirm" type="password" placeholder="Confirm password" required />

			<button id="register" class="register" type="submit">Register</button>

			<div class="switch">
				Already have an account? <a href="index.html">Login</a>
			</div>
		</form>
        <script type="module" src="register.js" defer></script>
		<script>
			(function () {
				const button = document.getElementById("themeToggle");
				if (!button) return;

				function getTheme() {
					return document.documentElement.getAttribute("data-theme") || "dark";
				}

				function setTheme(theme) {
					document.documentElement.setAttribute("data-theme", theme);
					try {
						localStorage.setItem("theme", theme);
					} catch {
						// ignore
					}
					const label = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
					button.setAttribute("aria-label", label);
					button.title = label;
				}

				setTheme(getTheme());
				button.addEventListener("click", () => {
					setTheme(getTheme() === "dark" ? "light" : "dark");
				});
			})();
		</script>
	<style>
			body {
				padding-bottom: 72px;
			}
			.site-footer {
				position: fixed;
				left: 0;
				right: 0;
				bottom: 0;
				z-index: 250;
				padding: 12px 16px;
				background: rgba(0, 0, 0, 0.28);
				backdrop-filter: blur(10px);
				border-top: 1px solid rgba(255, 255, 255, 0.10);
				color: var(--muted, rgba(255, 255, 255, 0.7));
				font-size: 12px;
			}
			html[data-theme="light"] .site-footer {
				background: rgba(255, 255, 255, 0.65);
				border-top-color: rgba(15, 23, 42, 0.10);
			}
			.site-footer__inner {
				max-width: 1100px;
				margin: 0 auto;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				flex-wrap: wrap;
			}
			.site-footer__links {
				display: flex;
				gap: 14px;
				flex-wrap: wrap;
			}
			.site-footer a {
				color: inherit;
				text-decoration: none;
				opacity: 0.92;
			}
			.site-footer a:hover {
				opacity: 1;
				color: var(--text, rgba(255, 255, 255, 0.92));
			}
		</style>
		<footer class="site-footer" role="contentinfo">
			<div class="site-footer__inner">
				<div>© <span class="site-footer__year"></span> Secure File Sharing Platform. All rights reserved.</div>
				<div class="site-footer__links">
					<a href="mailto:ramakrishnauggam11@gmail.com">Contact us</a>
				</div>
			</div>
		</footer>
		<script>
			(function () {
				try {
					const y = String(new Date().getFullYear());
					document.querySelectorAll(".site-footer__year").forEach((el) => (el.textContent = y));
				} catch {
					// ignore
				}
			})();
		</script>
	</body>
</html>
